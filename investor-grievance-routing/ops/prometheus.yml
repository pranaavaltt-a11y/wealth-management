global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: verifier
    static_configs: [{targets: ["verifier:8100"]}]
    metrics_path: /metrics/
  - job_name: llm-stub
    static_configs: [{targets: ["llm-stub:8200"]}]
    metrics_path: /metrics/
  - job_name: agent-worker
    # Docker's DNS returns one A record per replica, so every scaled worker is scraped.
    dns_sd_configs:
      - names: ["agent-worker"]
        type: A
        port: 9100
        refresh_interval: 10s
  - job_name: cadvisor
    static_configs: [{targets: ["cadvisor:8080"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
